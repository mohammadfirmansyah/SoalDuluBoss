name: soal_dulu_boss
description: Aplikasi Alarm dengan Tantangan Soal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # Background Tasks & Alarm
  android_alarm_manager_plus: ^3.0.3  # VERSI LAMA YANG STABIL
  flutter_local_notifications: ^15.1.1  # VERSI LAMA YANG STABIL

  # Media & Haptic
  audioplayers: ^5.2.1  # VERSI LAMA YANG STABIL
  flutter_vibrate: ^1.3.0

  # System Features
  wakelock_plus: ^1.1.4  # VERSI LAMA YANG STABIL
  permission_handler: ^11.0.1  # VERSI LAMA YANG STABIL

  # Time & Date
  timezone: ^0.9.2  # VERSI LAMA YANG STABIL

  # State Management
  rxdart: ^0.27.7  # VERSI LAMA YANG STABIL

  # UI
  google_fonts: ^6.1.0  # VERSI LAMA YANG STABIL

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/questions.json
    - assets/audio/alarm_sound.mp3